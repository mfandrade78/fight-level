name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.4'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK for GitHub release
        run: cp build/app/outputs/flutter-apk/app-release.apk fight-level.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: fight-level-apk
          path: fight-level.apk

      - name: Publish APK to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Fight Level APK (latest)
          files: fight-level.apk
          generate_release_notes: true
